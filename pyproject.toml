[project]
name = "papertrail"
version = "0.1.0"
description = "From Paper to Podium: an agent harness that understands a paper before it presents it."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai-slim[openai]>=2.55",
  "httpx>=0.27",
  "pyyaml>=6",
  "pymupdf>=1.24",
  "pandas>=2",
  "matplotlib>=3.8",
  "pillow>=10",
  "python-dotenv>=1",
  "qrcode[pil]>=7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
include = ["qa*", "common*", "stages*", "tools*", "judges*", "local*", "report*", "compare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
